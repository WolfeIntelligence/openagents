schema: 1
name: research-brief
owner: openagents
version: 0.9.0
kind: skill
title: Research Brief
summary: Turn a question into a sourced brief — search plan, graded sources, claim ledger, and a brief template
license: MIT
tags: [research, sourcing, writing, fact-checking, skill]
runtimes: [claude-code, cursor, codex, openai-agents, generic]
pricing:
  model: free
  amount_cents: 0
  currency: usd
entry: SKILL.md
files:
  - SKILL.md
  - templates/brief.md
  - source-grading.md
inputs:
  - name: question
    type: string
    required: true
    description: The question or claim to research
  - name: depth
    type: string
    required: false
    default: standard
    description: "quick (3-5 sources) | standard (6-12 sources) | deep (12+, multiple source types)"
  - name: audience
    type: string
    required: false
    description: Who the brief is for, to calibrate technical depth and framing (e.g. "engineering leadership", "general readers")
requires: []
