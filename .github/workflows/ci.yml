name: CI

on:
  push:
  pull_request:

jobs:
  site:
    name: Site (typecheck, lint, catalog, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Next generates route/layout prop types (e.g. LayoutProps) into .next/types;
      # tsc needs them before a build has ever run.
      - name: Generate Next.js types
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Catalog check (openagent.yaml validity + .meta.json presence)
        run: npm run check:catalog

      # G-O4: drizzle/ is the committed source of truth for the schema (see
      # src/content/docs/self-hosting.md#migrations). `drizzle-kit generate` is a
      # snapshot diff against src/lib/db/schema.ts — offline, no DATABASE_URL needed
      # — so re-running it here is a no-op ("No schema changes, nothing to migrate")
      # when drizzle/ is in sync, and writes a new migration file when someone edited
      # the schema and forgot to run `npm run db:generate` before committing. Note
      # `drizzle-kit check` (a different subcommand) only validates the internal
      # consistency of the migrations folder itself, not drift against the schema —
      # it does NOT catch this, which is why this step uses `generate` + `git diff`
      # instead. `drizzle/` is gitignored (existing repo convention), so `git add -f`
      # is required before diffing or an unstaged new file wouldn't show up at all.
      - name: Check for schema/migration drift (drizzle/)
        run: |
          npx drizzle-kit generate
          git add -f drizzle
          git diff --cached --exit-code -- drizzle || {
            echo "::error::src/lib/db/schema.ts and drizzle/ are out of sync. Run 'npm run db:generate' locally and commit the result.";
            exit 1;
          }

      # G-O7: every src/app/api/**/route.ts must have a matching entry in
      # public/openapi.json (see src/content/docs/api.md#openapi and
      # scripts/check-openapi.ts) so the spec can't silently drift from the routes.
      - name: OpenAPI coverage check
        run: npx tsx scripts/check-openapi.ts

      - name: Unit tests
        run: npm test --if-present

      # Zero-env guarantee: the app must build with no environment variables set at
      # all — no DATABASE_URL, no auth, no Stripe keys. This is what makes the seed
      # catalog, docs, and CLI/API usable on a fresh deploy with zero configuration
      # (see src/content/docs/self-hosting.md). Do not add an `env:` block here.
      - name: Build with zero env vars
        run: npx next build

  cli:
    name: CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm test --if-present

      - name: Smoke test (--help)
        run: node bin/openagents.js --help

  e2e:
    name: E2E (Playwright, zero-env production server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # e2e/cli.spec.ts shells out to cli/bin/openagents.js directly (no npm
      # link/pack needed), but that script still needs its own dependencies
      # (tar-stream, etc.) installed.
      - run: npm ci --prefix cli

      - name: Install Playwright's Chromium browser
        run: npx playwright install --with-deps chromium

      # Same zero-env guarantee as the `site` job's build — see the comment
      # there. playwright.config.ts's webServer only *starts* `next start`;
      # it does not build, so this has to happen first.
      - name: Build with zero env vars
        run: npx next build

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
